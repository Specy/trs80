name: CI

on:
  pull_request:
  push:
    branches:
      # master is this repository's default branch; main is listed so a rename
      # does not silently stop running CI.
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          # One lockfile at the root covers every workspace in the monorepo.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only @specy/z80 (packages/z80-machine). The z80-* packages it is
      # compiled from have no build of their own: they export their TypeScript
      # source, which this bundles. The rest of this monorepo - the TRS-80
      # emulator, the cassette tools, the web apps - is upstream's and is not
      # published from here, so building it would only add minutes and
      # failures that no release depends on.
      #
      # z80-machine's own build script starts with `tsc --noEmit`, so this
      # type-checks the library as well as bundling it.
      - name: Build the library
        run: npm run build -w packages/z80-machine

      # The suites of every z80-* package (Vitest takes the argument as a
      # path filter), z80-machine's included. All of them are compiled into
      # the published bundle, so all of them are this package's correctness.
      # The TRS-80 packages' suites are upstream's, left out for the reason
      # above.
      - name: Run tests
        run: npx vitest run packages/z80-

      # Assembles and runs programs through the built dist/, which is the one
      # thing the suites above cannot see: they import the workspace packages
      # directly, never the bundle that vite rolls them into or the
      # declarations vite-plugin-dts inlines, and both can break with every
      # test still green.
      - name: Run smoke test
        run: npm run test:dist -w packages/z80-machine
